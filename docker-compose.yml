services:

  app:
    image: flask-devops-app:1.0
    container_name: flask-app
    ports:
      - "5000:5000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      DATABASE_URI: "postgresql://appuser:apppassword@db:5432/appdb"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-cache

volumes:
  postgres_data: